name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore FiapCloudGames.BuildingBlocks.slnx --configfile NuGet.Config

      - name: Build
        run: dotnet build FiapCloudGames.BuildingBlocks.slnx -c Release --no-restore

      - name: Test
        run: dotnet test FiapCloudGames.BuildingBlocks.slnx -c Release --no-build --no-restore

      - name: Pack
        run: >-
          dotnet pack src/FiapCloudGames.BuildingBlocks/FiapCloudGames.BuildingBlocks.csproj
          -c Release
          --no-build
          --no-restore
          -o artifacts/packages

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: building-blocks-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
