name: Publish package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
          source-url: https://nuget.pkg.github.com/MarinsPedro/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag inválida: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore FiapCloudGames.BuildingBlocks.slnx --configfile NuGet.Config

      - name: Build
        run: dotnet build FiapCloudGames.BuildingBlocks.slnx -c Release --no-restore

      - name: Test
        run: dotnet test FiapCloudGames.BuildingBlocks.slnx -c Release --no-build --no-restore

      - name: Pack
        run: >-
          dotnet pack src/FiapCloudGames.BuildingBlocks/FiapCloudGames.BuildingBlocks.csproj
          -c Release
          --no-build
          --no-restore
          -p:PackageVersion=${{ env.PACKAGE_VERSION }}
          -o artifacts/packages

      - name: Publish to GitHub Packages
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/MarinsPedro/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
